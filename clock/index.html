<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close,dark_mode,fullscreen,fullscreen_exit,light_mode,settings,wallpaper" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="slider.css">
</head>

<body class="dark-mode">
    <div id="header-wrapper">
        <div id="header">
            <button id="dark-mode" class="material-symbols-outlined">dark_mode</button>
            <button id="theme" class="material-symbols-outlined">wallpaper</button>
            <button id="settings" class="material-symbols-outlined">settings</button>
            <button id="fullscreen" class="material-symbols-outlined">fullscreen</button>
        </div>
    </div>
    <div id="menu-wrapper">
        <div id="settings-menu" class="menu">
            <button class="close material-symbols-outlined">close</button>
            <div id="settings-content">
                <label for="show-date" class="label-text">Show date</label>
                <label class="switch">
                    <input type="checkbox" id="show-date">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div id="theme-menu" class="menu">
            <button class="close material-symbols-outlined">close</button>
            <div id="theme-content">
                <div class="theme-example" style="background-color: #171719;" data-theme="dark">
                    <h1 class="time-example" style="color: white;">14:55:03</h1>
                </div>
                <div class="theme-example" style="background-color: white;" data-theme="light">
                    <h1 class="time-example" style="color: black;">14:55:03</h1>
                </div>
                <div class="theme-example"
                    style="background-image: url('https://www.creativefabrica.com/wp-content/uploads/2023/09/01/gothic-halloween-wallpaper-Graphics-78301451-1.jpg');"
                    data-theme="dark"
                    data-url="https://www.creativefabrica.com/wp-content/uploads/2023/09/01/gothic-halloween-wallpaper-Graphics-78301451-1.jpg">
                    <h1 class="time-example" style="color: white;">14:55:03</h1>
                </div>
                <div class="theme-example"
                    style="background-image: url('https://depositphotos-blog.s3.eu-west-1.amazonaws.com/uploads/2017/07/Soothing-nature-backgrounds-2.jpg');"
                    data-theme="dark"
                    data-url="https://depositphotos-blog.s3.eu-west-1.amazonaws.com/uploads/2017/07/Soothing-nature-backgrounds-2.jpg">
                    <h1 class="time-example" style="color: white;">14:55:03</h1>
                </div>
                <div class="theme-example"
                    style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQye1tNVWY_5ZUg5mKiDTKaYZ7mscb5Cz2g9Xz0WyCZloYNk2g83rPzPi63&s=10');"
                    data-theme="dark"
                    data-url="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQye1tNVWY_5ZUg5mKiDTKaYZ7mscb5Cz2g9Xz0WyCZloYNk2g83rPzPi63&s=10">
                    <h1 class="time-example" style="color: white;">14:55:03</h1>
                </div>
                <div class="theme-example"
                    style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS8XjT0Gvr7P-5aFCVMqRmb3Y8zVWJKifA-EwnrA9MCv6YOJczWz8j0NSo&s=10');"
                    data-theme="light"
                    data-url="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS8XjT0Gvr7P-5aFCVMqRmb3Y8zVWJKifA-EwnrA9MCv6YOJczWz8j0NSo&s=10">
                    <h1 class="time-example" style="color: black;">14:55:03</h1>
                </div>
            </div>
        </div>
    </div>
    <div id="time-container">
        <h1 id="digital"></h1>
        <h3 id="date"></h3>
    </div>
    <script src="script.js"></script>
</body>
