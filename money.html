<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat';
            overflow-x: hidden;
        }

        :root {
            --border: black;
            --light-bg: #ddf0ea;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --border: #969e9d;
                --light-bg: #41474d;
            }
        }

        button {
            transition: 100ms;
            cursor: pointer;
        }

        button:hover {
            scale: 1.05;
        }

        button:active {
            scale: 0.95;
        }

        #machine-container {
            display: flex;
            justify-content: space-around;
            max-width: 100%;
            flex-wrap: wrap;
        }

        .machine,
        .machine-example {
            position: relative;
            width: 200px;
            height: 225px;
            border: 2px solid var(--border);
            margin-bottom: 20px;
        }

        .compartment,
        .compartment-example {
            position: relative;
            width: 40px;
            height: 10px;
            border: 2px solid var(--border);
            --background: #ddf0ea;
            background-color: var(--background);
            margin: 10px;
            transition: 500ms;
            --border-size: 0px;
            z-index: 1;
        }

        .compartment {
            cursor: pointer;
        }

        .compartment-example {
            cursor: not-allowed
        }

        .compartment.open {
            scale: 2;
            transform: translateY(10px);
            --border-size: 8px;
        }

        .compartment.drag-over {
            --background: #a2dbc7;
        }

        .compartment.deterged {
            --background: #f0f09c;
        }

        .compartment:before {
            content: '';
            position: absolute;
            border-bottom: var(--border-size) solid var(--background);
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            transition: 500ms;
            width: 32px;
            height: 0;
            bottom: 11.5px;
            z-index: 1;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .circle,
        .circle-example {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 10px;
            border-radius: 100%;
            border: 2px solid var(--border);
            transition: 500ms;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle.drag-over {
            background-color: var(--light-bg);
        }

        .circle input {
            width: 30px;
            padding: 5px;
        }

        .circle button {
            background-color: var(--light-bg);
            border-radius: 5px;
            border: 2px solid var(--border);
            padding: 5px;
            margin: 5px;
        }

        .circle.washing {
            animation: spin 1s infinite linear;
        }

        .timer {
            font-size: 50px;
            position: absolute;
            margin: 0;
            top: 90px;
            width: 200px;
            text-align: center;
        }

        .circle img {
            width: 50px;
            position: relative;
            top: 50px;
        }

        .pink {
            background-color: pink;
        }

        #detergent-container {
            position: absolute;
            right: 0;
            top: 0px;
            width: 50px;
            height: 100%;
            display: flex;
            align-items: center;
            z-index: 1;
        }

        #detergent-image {
            width: 50px;
            background-color: #b3e3e1;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            cursor: grab;
        }

        #detergent:before,
        #detergent:after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            right: 0;
        }

        #detergent:before {
            top: calc(50% - 65px);
            border-bottom: 30px solid #b3e3e1;
            border-left: 50px solid transparent;
            border-bottom-left-radius: 10px;
        }

        #detergent:after {
            bottom: calc(50% - 61px);
            border-top: 30px solid #b3e3e1;
            border-left: 50px solid transparent;
            border-top-left-radius: 10px;
        }

        #shop {
            position: relative;
            width: calc(100% - 35px);
            left: -5px;
            padding: 30px;
            display: flex;
            margin-top: 100px;
            border-top: 5px solid var(--light-bg);
            border-radius: 20px;
        }

        .shop-item {
            border: 5px solid var(--light-bg);
            border-radius: 20px;
            padding: 30px;
            margin-left: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .shop-item p {
            margin-top: 0;
        }

        .price {
            transform: rotate(20deg);
            background-color: var(--light-bg);
            font-size: larger;
        }

        .buy {
            background-color: var(--light-bg);
            border-radius: 5px;
            width: 50px;
        }

        #money-container {
            position: absolute;
            bottom: 0;
            right: 29.5px;
            background-color: #8ee38e;
            padding: 5px;
            padding-right: 40px;
            font-size: xx-large;
            border-top-left-radius: 5px;
            border-top-right-radius: 10px;
            box-shadow: 0px 20px #8ee38e;
        }

        #money-container:after {
            content: '';
            position: absolute;
            top: 0;
            right: -30px;
            width: 0;
            height: 0;
            border-bottom: 49px solid #8ee38e;
            border-right: 35px solid transparent;
            border-top-left-radius: 10px;
            box-shadow: 0px 20px #8ee38e;
        }

        #money {
            margin: 0px;
            border-radius: 10px;
            cursor: grab;
        }
    </style>
</head>

<body>
    <div id="machine-container">
        <div class="machine">
            <div class="compartment"></div>
            <div class="circle"></div>
        </div>
    </div>
    <div id="detergent-container">
        <div id="detergent">
            <img src="Content/Money_Laundry_Simulator/detergent.png" id="detergent-image">
        </div>
    </div>
    <div id="shop">
        <div class="shop-item">
            <p>Normal machine</p>
            <p>1.5x profit, 5sec</p>
            <p class="price">$30</p>
            <div class="machine-example">
                <div class="compartment-example"></div>
                <div class="circle-example"></div>
            </div>
            <button class="buy" machinetype="pink">Buy</button>
        </div>
        <div class="shop-item">
            <p>Pink machine</p>
            <p>2x profit, 20 sec</p>
            <p class="price">$60</p>
            <div class="machine-example pink">
                <div class="compartment-example"></div>
                <div class="circle-example pink"></div>
            </div>
            <button class="buy" machinetype="pink">Buy</button>
        </div>
    </div>
    <div id="money-container">
        <p id="money" draggable="true">$5</p>
    </div>

    <script>
        const machineContainer = document.getElementById("machine-container")
        const machineEls = document.getElementsByClassName("machine")
        const compartments = document.getElementsByClassName("compartment");
        const circles = document.getElementsByClassName("circle");
        const moneyContainer = document.getElementById("money-container")
        const moneyEl = document.getElementById("money");
        const buys = document.getElementsByClassName("buy");

        const machineTypes = {
            normal: {
                code: `
                <div class="machine">
                    <div class="compartment"></div>
                    <div class="circle"></div>
                </div>
                `, cost: 30,
                profit: 1.5,
                time: 5
            },
            pink: {
                code: `
                <div class="machine pink">
                    <div class="compartment"></div>
                    <div class="circle pink"></div>
                </div>
                `, cost: 60,
                profit: 2,
                time: 20
            }
        }

        var money = 5;
        var machines = [{ type: "normal", state: "idle", timer: null, money: null }]

        var compartmentTimeout;
        var laundryIntervals;

        function continueGame() {
            money = Number(localStorage.getItem("laundryMoney"));
            moneyEl.innerText = `$${money}`;
            machines = JSON.parse(localStorage.getItem("laundryMachines"));
            for (let i = 0; i < machines.length; i++) {
                if (i > 0) {
                    machineContainer.insertAdjacentHTML("beforeend", machineTypes[machines[i].type].code);
                }
                if (machines[i].state == "running") {
                    const machine = machineEls[i];
                    const compartment = machine.children[0];
                    compartment.classList.add("deterged");
                    startLaundry(machine.children[1], machine, i, compartment,
                        machines[i].timer, machines[i].money)
                }
            }
        }

        function save() {
            localStorage.setItem("laundryMoney", money);
            localStorage.setItem("laundryMachines", JSON.stringify(machines))
        }

        function changeMoney(count) {
            money += count;
            moneyEl.innerText = `$${money}`;
            localStorage.setItem("laundryMoney", money)
            save()
        }

        function timer(machine, machineIndex, timerEl, intervalIndex) {
            machines[machineIndex].timer -= 1;
            timerEl.innerText = machines[machineIndex].timer;
            if (machines[machineIndex].timer == 0) {
                clearInterval(intervalIndex);
                finishLaundry(machine, machineIndex);
            }
            save();
        }

        function startLaundry(circle, machine, machineIndex, compartment, secs, moneyInserted) {
            const bill = document.createElement("img");
            bill.src = "Content/Money_Laundry_Simulator/bill.webp";
            bill.draggable = false;
            const timerEl = document.createElement("p");
            timerEl.classList.add("timer")
            machines[machineIndex].timer = secs;
            timerEl.innerText = machines[machineIndex].timer
            laundryIntervals = setInterval(() => { timer(machine, machineIndex, timerEl, laundryIntervals) }, 1000);
            circle.replaceChildren(bill);
            machine.appendChild(timerEl);
            circle.classList.remove("inserting");
            circle.classList.add("washing");
            compartment.classList.remove("open");
            save();
        }

        function checkStartLaundry(el) {
            const machine = el.parentElement;
            const machineIndex = [].slice.call(machineEls).indexOf(machine)
            const compartment = machine.children[0];
            const moneyInserted = el.children[0].value;
            if (compartment.classList.contains("deterged")) {
                if (moneyInserted > 0 && moneyInserted <= money) {
                    const secs = machineTypes[machines[machineIndex].type].time;
                    machines[machineIndex].state = "running";
                    changeMoney(-moneyInserted);
                    machines[machineIndex].money = moneyInserted;
                    startLaundry(el, machine, machineIndex, compartment, secs, moneyInserted);
                }
            } else {
                compartment.classList.add("drag-over")
                try {
                    clearTimeout(compartmentTimeout)
                } catch { }
                compartmentTimeout = setTimeout(() => {
                    compartment.classList.remove("drag-over")
                }, 500)
            }
        }

        function finishLaundry(machine, machineIndex) {
            machines[machineIndex].state = "idle";
            const compartment = machine.children[0];
            const circle = machine.children[1];
            const timerEl = machine.children[2];
            compartment.classList.remove("deterged");
            circle.classList.remove("washing");
            circle.replaceChildren();
            timerEl.remove()
            changeMoney(Math.floor(machines[machineIndex].money * machineTypes[machines[machineIndex].type].profit))
            save()
        }

        document.addEventListener("scroll", () => {
            moneyContainer.style.bottom = `-${window.scrollY}px`;
        })


        if (localStorage.getItem("laundryMoney") && localStorage.getItem("laundryMachines")) continueGame();
        else save();

        moneyEl.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("Text", "money");
        })

        for (let i = 0; i < compartments.length; i++) {
            compartments[i].addEventListener("click", (e) => {
                const circle = e.target.parentElement.children[1];
                if (e.target.classList.contains("open")) {
                    e.target.classList.remove("open");
                } else if (!circle.classList.contains("washing")) {
                    e.target.classList.add("open");
                }
            })

            compartments[i].addEventListener("dragover", (e) => {
                e.preventDefault();
                if (e.target.classList.contains("open")) {
                    e.target.classList.add("drag-over");
                }
            })

            compartments[i].addEventListener("dragleave", (e) => {
                e.target.classList.remove("drag-over");
            })

            compartments[i].addEventListener("drop", (e) => {
                e.target.classList.remove("drag-over")
                if (e.target.classList.contains("open")) {
                    e.preventDefault();
                    const data = e.dataTransfer.getData("text");
                    if (data.endsWith("detergent.png")) {
                        e.target.classList.add("deterged");
                    }
                }
            })
        }

        for (let i = 0; i < circles.length; i++) {
            circles[i].addEventListener("dragover", (e) => {
                e.preventDefault();
                e.target.classList.add("drag-over");
            })

            circles[i].addEventListener("dragleave", (e) => {
                e.target.classList.remove("drag-over");
            })

            circles[i].addEventListener("drop", (e) => {
                e.target.classList.remove("drag-over")
                e.preventDefault();
                const data = e.dataTransfer.getData("text");
                if (data == "money" && !e.target.classList.contains("inserting")) {
                    e.target.classList.add("inserting");
                    const input = document.createElement("input");
                    input.type = "number";
                    input.placeholder = money;
                    const button = document.createElement("button");
                    button.innerText = "Insert money";
                    button.addEventListener("click", () => { checkStartLaundry(e.target) })
                    e.target.appendChild(input);
                    e.target.appendChild(button);
                }
            })
        }

        for (let i = 0; i < buys.length; i++) {
            buys[i].addEventListener("click", (e) => {
                if (money >= 30) {
                    const type = machineTypes[e.target.getAttribute("machinetype")];

                    changeMoney(type.cost);

                    machineContainer.insertAdjacentHTML("beforeend", type.code);

                    machines.push({ type: e.target.getAttribute("machinetype"), state: "idle", timer: null, money: null });

                    const machine = machineEls[machineEls.length - 1];
                    const compartment = machine.children[0];
                    const circle = machine.children[1];

                    compartment.addEventListener("click", (e) => {
                        const circle = e.target.parentElement.children[1];
                        if (e.target.classList.contains("open")) {
                            e.target.classList.remove("open");
                        } else if (!circle.classList.contains("washing")) {
                            e.target.classList.add("open");
                        }
                    })

                    compartment.addEventListener("dragover", (e) => {
                        e.preventDefault();
                        if (e.target.classList.contains("open")) {
                            e.target.classList.add("drag-over");
                        }
                    })

                    compartment.addEventListener("dragleave", (e) => {
                        e.target.classList.remove("drag-over");
                    })

                    compartment.addEventListener("drop", (e) => {
                        e.target.classList.remove("drag-over");
                        if (e.target.classList.contains("open")) {
                            e.preventDefault();
                            const data = e.dataTransfer.getData("text");
                            if (data.endsWith("detergent.png")) {
                                e.target.classList.add("deterged");
                            }
                        }
                    })

                    circle.addEventListener("dragover", (e) => {
                        e.preventDefault();
                        e.target.classList.add("drag-over");
                    })

                    circle.addEventListener("dragleave", (e) => {
                        e.target.classList.remove("drag-over");
                    })

                    circle.addEventListener("drop", (e) => {
                        e.target.classList.remove("drag-over")
                        e.preventDefault();
                        const data = e.dataTransfer.getData("text");
                        if (data == "money" && !e.target.classList.contains("inserting")) {
                            e.target.classList.add("inserting");
                            const input = document.createElement("input");
                            input.type = "number";
                            input.placeholder = money;
                            const button = document.createElement("button");
                            button.innerText = "Insert money";
                            button.addEventListener("click", () => { checkStartLaundry(e.target) })
                            e.target.appendChild(input);
                            e.target.appendChild(button);
                        }
                    })
                    save();
                }
            })
        }

    </script>
</body>

</html>
