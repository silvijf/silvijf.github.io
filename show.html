<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="icon" type="image/x-icon"
        href="https://raw.githubusercontent.com/silvijf/silvijf.github.io/refs/heads/main/Content/Icons/logo.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #text {
            font-size: 30vw;
            font-family: 'Montserrat';
            margin: 0;
        }
    </style>
</head>

<body>
    <p id="text">NOPE</p>

    <script>
        const strings = ["NOPE", "YES", "WHY", "WOW", "HI", "PLS", ":3"]
        const text = document.getElementById("text")

        let index = window.location.href.indexOf("?")
        if (index != -1) {
            var string = window.location.href.substring(index + 1)
        }
        else {
            var sting = strings[0]
        }

        if (strings[string] != undefined) {
            text.innerHTML = strings[string];
            document.title = strings[string];
        } else {
            if (string != undefined) {
                let newString = decodeURIComponent(string.replaceAll("+", " "));
                if (!newString.startsWith("$") && !newString.startsWith("\\$")) newString = newString.toUpperCase();
                else if (newString.startsWith("$") || newString.startsWith("\\$")) newString = newString.slice(1, newString.length);
                text.innerHTML = newString;
                document.title = newString;
                if (newString.length < 4) text.style.fontSize = "30vw"
                else text.style.fontSize = `${100 / (newString.length * 0.8)}vw`;
            } else {
                document.title = "NOPE";
            }
        }


    </script>
</body>

</html>
