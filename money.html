<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Laundry Simulator</title>
    <link rel="icon" href="Content/Money_Laundry_Simulator/bill.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat';
            overflow-x: hidden;
        }

        html:has(#detergent-clone) *,
        html:has(#money-clone) * {
            cursor: grabbing !important;
        }

        :root {
            --border: black;
            --light-bg: #ddf0ea;
            --light-gray: #dddddd;
            --dark-gray: #bbbbbb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --border: #969e9d;
                --light-bg: #41474d;
                --light-gray: #333333;
                --dark-gray: #555555;
            }
        }

        button {
            transition: 100ms;
            cursor: pointer;
        }

        button:hover {
            scale: 1.05;
        }

        button:active {
            scale: 0.95;
        }

        #machine-container {
            display: flex;
            justify-content: space-around;
            max-width: 100%;
            flex-wrap: wrap;
        }

        .machine,
        .machine-example {
            position: relative;
            width: 200px;
            height: 225px;
            border: 2px solid var(--border);
            margin-bottom: 20px;
            z-index: 2;
        }

        .compartment,
        .compartment-example {
            position: relative;
            width: 40px;
            height: 10px;
            border: 2px solid var(--border);
            --background: #ddf0ea;
            background-color: var(--background);
            margin: 10px;
            transition: 500ms;
            --border-size: 0px;
            z-index: 1;
        }

        .compartment {
            cursor: pointer;
        }


        .compartment:hover {
            background-color: #a2dbc7;
        }

        .compartment-example {
            cursor: not-allowed
        }

        .compartment.open {
            scale: 2;
            transform: translateY(10px);
            --border-size: 8px;
        }

        .compartment.deterged {
            --background: #f0f09c !important;
        }

        .compartment:before {
            content: '';
            position: absolute;
            border-bottom: var(--border-size) solid var(--background);
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            transition: 500ms;
            width: 32px;
            height: 0;
            bottom: 11.5px;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .circle,
        .circle-example {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 10px;
            border-radius: 100%;
            border: 2px solid var(--border);
            transition: 500ms;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle:not(.washing):not(.inserting):hover {
            background-color: var(--light-bg);
        }

        .circle:not(.washing):not(.inserting).pink:hover {
            background-color: #e8a2ad;
        }

        .circle:not(.washing):not(.inserting).yellow:hover {
            background-color: #d9d971;
        }

        .circle input {
            width: 50px;
            padding: 5px;
        }

        .circle button {
            background-color: var(--light-bg);
            border-radius: 5px;
            border: 2px solid var(--border);
            padding: 5px;
            margin: 5px;
        }

        .circle.washing {
            animation: spin 1s infinite linear;
        }

        .timer {
            font-size: 50px;
            position: absolute;
            margin: 0;
            top: 90px;
            width: 200px;
            text-align: center;
        }

        .circle img {
            width: 50px;
            position: relative;
            top: 50px;
        }

        .sell {
            background-color: #f75555;
            position: absolute;
            right: 4px;
            bottom: 4px;
            padding: 4px;
            border-radius: 5px;
        }

        .circle.washing~.sell {
            cursor: not-allowed;
            background-color: #a18787;
        }

        .pink {
            background-color: pink;
        }

        .yellow {
            background-color: #f3f38e;
        }

        #detergent-container {
            position: absolute;
            right: -10px;
            top: 0px;
            width: 50px;
            height: 100%;
            display: flex;
            align-items: center;
            z-index: 1;
        }

        #detergent-image {
            width: 50px;
            background-color: #b3e3e1;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            cursor: grab;
        }

        #detergent-clone {
            position: absolute;
            width: 50px;
            background-color: #b3e3e1;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            z-index: 2;
            opacity: 0.5;
            pointer-events: none;
            transform-origin: 50% 5px;
            transition: transform 100ms;
        }

        #detergent-count {
            position: absolute;
            bottom: calc(50% - 50px);
            left: 5px;
            font-size: larger;
            pointer-events: none;
        }

        #detergent:before,
        #detergent:after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            right: 0;
        }

        #detergent:before {
            top: calc(50% - 65px);
            border-bottom: 30px solid #b3e3e1;
            border-left: 50px solid transparent;
            border-bottom-left-radius: 10px;
        }

        #detergent:after {
            bottom: calc(50% - 61px);
            border-top: 30px solid #b3e3e1;
            border-left: 50px solid transparent;
            border-top-left-radius: 10px;
        }

        #tab-btns {
            position: relative;
            display: flex;
            margin-top: 75px;
            left: -8px;
        }

        .tab-btn {
            width: 100%;
            text-align: center;
            padding: 20px;
            cursor: pointer;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            border-bottom: 5px solid var(--light-gray);
            transition: 100ms;
        }

        .tab-btn:hover {
            background-color: var(--light-gray);
            border-bottom: 5px solid var(--dark-gray);
        }

        .tab-btn.active {
            background-color: var(--light-bg);
            border-bottom: 5px solid #a2dbc7;
        }

        .tab {
            position: relative;
            width: calc(100% - 35px);
            left: -5px;
            padding: 30px;
            flex-wrap: wrap;
            display: none;
        }

        .tab.active {
            display: flex;
        }

        .shop-item {
            border: 5px solid var(--light-bg);
            border-radius: 20px;
            padding: 30px;
            margin: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .shop-item p {
            margin-top: 0;
        }

        .detergent-example {
            height: 250px;
        }

        .price {
            transform: rotate(20deg);
            background-color: var(--light-bg);
            font-size: larger;
        }

        .buy {
            background-color: var(--light-bg);
            border-radius: 5px;
            width: 50px;
        }

        #money-container {
            position: absolute;
            bottom: 0;
            right: 29.5px;
            background-color: #8ee38e;
            padding: 5px;
            padding-right: 40px;
            border-top-left-radius: 5px;
            border-top-right-radius: 10px;
            box-shadow: 0px 20px #8ee38e;
            z-index: 2;
        }

        #money-container:after {
            content: '';
            position: absolute;
            top: 0;
            right: -30px;
            width: 0;
            height: 0;
            border-bottom: 49px solid #8ee38e;
            border-right: 35px solid transparent;
            border-top-left-radius: 10px;
            box-shadow: 0px 20px #8ee38e;
        }

        #money {
            margin: 0px;
            border-radius: 10px;
            font-size: xx-large;
            cursor: grab;
            user-select: none;
        }

        #money-clone {
            position: absolute;
            margin: 0px;
            border-radius: 10px;
            font-size: xx-large;
            background-color: #8ee38e;
            z-index: 2;
            pointer-events: none;
            transform-origin: 50% 5px;
            transition: transform 100ms;
        }
    </style>
</head>

<body>
    <div id="machine-container">
        <div class="machine">
            <div class="compartment"></div>
            <div class="circle"></div>
        </div>
    </div>
    <div id="detergent-container">
        <div id="detergent">
            <img src="Content/Money_Laundry_Simulator/detergent.png" id="detergent-image" draggable="false"
                oncontextmenu="return false;">
            <p id="detergent-count">4</p>
        </div>
    </div>
    <div id="tab-btns">
        <div class="tab-btn active" data-tab="tab1">Machines</div>
        <div class="tab-btn" data-tab="tab2">Detergent</div>
    </div>
    <div id="tab1" class="tab active">
        <div class="shop-item">
            <p>Normal machine</p>
            <p>1.2x profit, 5 sec, max $20</p>
            <p class="price">$40</p>
            <div class="machine-example">
                <div class="compartment-example"></div>
                <div class="circle-example"></div>
            </div>
            <button class="buy" data-type="machine" data-machinetype="normal">Buy</button>
        </div>
        <div class="shop-item">
            <p>Pink machine</p>
            <p>1.4x profit, 20 sec, max $30</p>
            <p class="price">$60</p>
            <div class="machine-example pink">
                <div class="compartment-example"></div>
                <div class="circle-example pink"></div>
            </div>
            <button class="buy" data-type="machine" data-machinetype="pink">Buy</button>
        </div>
        <div class="shop-item">
            <p>Yellow machine</p>
            <p>1.6x profit, 30 sec, max $50</p>
            <p class="price">$100</p>
            <div class="machine-example yellow">
                <div class="compartment-example"></div>
                <div class="circle-example yellow"></div>
            </div>
            <button class="buy" data-type="machine" data-machinetype="yellow">Buy</button>
        </div>
    </div>
    <div id="tab2" class="tab">
        <div class="shop-item">
            <p>Yellow detergent</p>
            <p>4 uses</p>
            <p class="price">$5</p>
            <img class="detergent-example" src="Content/Money_Laundry_Simulator/detergent.png">
            <button class="buy" data-type="detergent" data-detergenttype="normal">Buy</button>
        </div>
    </div>
    <div id="money-container">
        <p id="money">$5</p>
    </div>

    <script>
        const machineContainer = document.getElementById("machine-container");
        const machineEls = document.getElementsByClassName("machine");
        const compartments = document.getElementsByClassName("compartment");
        const circles = document.getElementsByClassName("circle");
        const detergent = document.getElementById("detergent-image");
        const detergentCountEl = document.getElementById("detergent-count")
        const sells = document.getElementsByClassName("sell");
        const moneyContainer = document.getElementById("money-container");
        const moneyEl = document.getElementById("money");
        const tabButtons = document.getElementById("tab-btns");
        const buys = document.getElementsByClassName("buy");

        const machineTypes = {
            normal: {
                code: `
                <div class="machine">
                    <div class="compartment"></div>
                    <div class="circle"></div>
                    <button class="sell">Sell</button>
                </div>
                `,
                cost: 40,
                profit: 1.2,
                time: 5,
                max: 20
            },
            pink: {
                code: `
                <div class="machine pink">
                    <div class="compartment"></div>
                    <div class="circle pink"></div>
                    <button class="sell">Sell</button>
                </div>
                `,
                cost: 100,
                profit: 1.4,
                time: 20,
                max: 30
            },
            yellow: {
                code: `
                <div class="machine yellow">
                    <div class="compartment"></div>
                    <div class="circle yellow"></div>
                    <button class="sell">Sell</button>
                </div>
                `,
                cost: 60,
                profit: 1.6,
                time: 30,
                max: 50
            }
        };

        var money = 5;
        var machines = [{ type: "normal", state: "idle", timer: null, money: null, deterged: false }];
        var detergentCount = 4;
        var grabbingDetergent = false;
        var lastDetergentPos;
        var grabbingMoney = false;
        var lastMoneyPos;
        var moneyWidth = moneyEl.getBoundingClientRect().width;

        var compartmentTimeout;
        var laundryIntervals = {};

        function continueGame() {
            money = Number(localStorage.getItem("laundryMoney"));
            moneyEl.innerText = `$${money}`;
            moneyWidth = moneyEl.getBoundingClientRect().width;
            machines = JSON.parse(localStorage.getItem("laundryMachines"));
            for (let i = 0; i < machines.length; i++) {
                if (i > 0) {
                    machineContainer.insertAdjacentHTML("beforeend", machineTypes[machines[i].type].code);
                }
                const machine = machineEls[i];
                const compartment = machine.children[0];
                if (machines[i].state == "running") {
                    startLaundry(machine.children[1], machine, i, compartment,
                        machines[i].timer, machines[i].money);
                }
                if (machines[i].deterged == true) {
                    compartment.classList.add("deterged");
                }
            }
            detergentCount = Number(localStorage.getItem("laundryDetergent"))
            if (detergentCount == undefined) detergentCount = 4;
            detergentCountEl.innerText = detergentCount;
        }

        function save() {
            localStorage.setItem("laundryMoney", money);
            localStorage.setItem("laundryMachines", JSON.stringify(machines));
            localStorage.setItem("laundryDetergent", detergentCount);
        }

        function changeMoney(count) {
            money += count;
            moneyEl.innerText = `$${money}`;
            moneyWidth = moneyEl.getBoundingClientRect().width;
            localStorage.setItem("laundryMoney", money);
            save();
        }

        function timer(machine, machineIndex, timerEl) {
            machines[machineIndex].timer -= 1;
            timerEl.innerText = machines[machineIndex].timer;
            if (machines[machineIndex].timer == 0) finishLaundry(machine, machineIndex);
            save();
        }

        function startLaundry(circle, machine, machineIndex, compartment, secs, moneyInserted) {
            const bill = document.createElement("img");
            bill.src = "Content/Money_Laundry_Simulator/bill.webp";
            bill.draggable = false;
            const timerEl = document.createElement("p");
            timerEl.classList.add("timer");
            machines[machineIndex].timer = secs;
            timerEl.innerText = machines[machineIndex].timer;
            laundryIntervals[machineIndex] = setInterval(() => { timer(machine, machineIndex, timerEl) }, 1000);
            circle.replaceChildren(bill);
            machine.appendChild(timerEl);
            circle.classList.remove("inserting");
            circle.classList.add("washing");
            compartment.classList.remove("open");
            save();
        }

        function checkStartLaundry(el) {
            const machine = el.parentElement;
            const machineIndex = [].slice.call(machineEls).indexOf(machine);
            const type = machines[machineIndex].type;
            const max = machineTypes[type].max;
            const compartment = machine.children[0];
            const moneyInserted = el.children[0].value;
            if (compartment.classList.contains("deterged")) {
                if (moneyInserted > 0 && moneyInserted <= money) {
                    if (moneyInserted <= max) {
                        const secs = machineTypes[machines[machineIndex].type].time;
                        machines[machineIndex].state = "running";
                        changeMoney(-moneyInserted);
                        machines[machineIndex].money = moneyInserted;
                        startLaundry(el, machine, machineIndex, compartment, secs, moneyInserted);
                    } else {
                        el.children[1].innerText = "Over max! Try this";
                        el.children[0].value = max;
                    }
                }
            } else {
                compartment.classList.add("drag-over");
                try {
                    clearTimeout(compartmentTimeout);
                } catch { }
                compartmentTimeout = setTimeout(() => {
                    compartment.classList.remove("drag-over");
                }, 500)
            }
        }

        function finishLaundry(machine, machineIndex) {
            clearInterval(laundryIntervals[machineIndex]);
            delete laundryIntervals[machineIndex];
            machines[machineIndex].state = "idle";
            machines[machineIndex].deterged = false;
            const compartment = machine.children[0];
            const circle = machine.children[1];
            let timerEl;
            if (machine.children[2].classList.contains("sell")) {
                timerEl = machine.children[3];
            } else {
                timerEl = machine.children[2];
            }
            compartment.classList.remove("deterged");
            circle.classList.remove("washing");
            circle.replaceChildren();
            timerEl.remove();
            let moneyGot = Math.floor(machines[machineIndex].money * machineTypes[machines[machineIndex].type].profit)
            moneyGot += (moneyGot == machines[machineIndex].money) ? 1 : 0
            changeMoney(moneyGot)
            save()
        }

        document.addEventListener("scroll", () => {
            moneyContainer.style.bottom = `-${window.scrollY}px`;
        })


        if (localStorage.getItem("laundryMoney") && localStorage.getItem("laundryMachines")) continueGame();
        else save();

        tabButtons.addEventListener("click", (e) => {
            const clicked = e.target.closest(".tab-btn")
            if (!clicked) return;
            document.querySelector(".tab-btn.active").classList.remove("active");
            clicked.classList.add("active");
            const tabId = clicked.dataset.tab;
            document.querySelector(".tab.active").classList.remove("active");
            document.getElementById(tabId).classList.add("active");
        })

        function updateRotations() {
            if (grabbingDetergent) {
                const detergentClone = document.getElementById("detergent-clone")
                const detergentPos = detergentClone.style.left.split("px")[0];
                detergentClone.style.transform = `rotate(${(detergentPos - lastDetergentPos) * 0.5}deg)`;
                lastDetergentPos = detergentPos;
            } else if (grabbingMoney) {
                const moneyClone = document.getElementById("money-clone")
                const moneyPos = moneyClone.style.left.split("px")[0];
                moneyClone.style.transform = `rotate(${(moneyPos - lastMoneyPos) * 0.2}deg)`;
                lastMoneyPos = moneyPos;
            }
        }

        function grabDetergentStart(e, type) {
            if (detergentCount > 0) {
                e.preventDefault();
                if (document.getElementById("detergent-clone")) document.getElementById("detergent-clone").remove()
                grabbingDetergent = true;
                const clone = detergent.cloneNode(true);
                clone.id = "detergent-clone";
                let touch;
                if (type == "mouse") {
                    touch = e;
                } else {
                    touch = e.touches[0];
                }
                clone.style.left = `${touch.clientX - 15}px`;
                clone.style.top = `${touch.clientY + window.scrollY - 5}px`;
                lastDetergentPos = touch.clientX - 15;
                document.body.appendChild(clone);
            }
        }

        function grabMoneyStart(e, type) {
            e.preventDefault();
            if (document.getElementById("money-clone")) document.getElementById("money-clone").remove()
            grabbingMoney = true;
            const clone = moneyEl.cloneNode(true);
            clone.id = "money-clone";
            if (type == "mouse") touch = e;
            else touch = e.touches[0];
            clone.style.left = `${touch.clientX - moneyWidth / 2}px`;
            clone.style.top = `${touch.clientY + window.scrollY - 5}px`;
            document.body.appendChild(clone);
        }

        function move(e, type) {
            e.preventDefault();
            let touch;
            if (type == "mouse") touch = e;
            else touch = e.touches[0];
            if (grabbingDetergent) {
                const detergentClone = document.getElementById("detergent-clone");
                detergentClone.style.left = `${touch.clientX - 15}px`;
                detergentClone.style.top = `${touch.clientY + window.scrollY - 5}px`;
            } else if (grabbingMoney) {
                const moneyClone = document.getElementById("money-clone");
                moneyClone.style.left = `${touch.clientX - moneyWidth / 2}px`;
                moneyClone.style.top = `${touch.clientY + window.scrollY - 5}px`;
            }
        }

        function drop(e, type) {
            let touch;
            if (type == "mouse") touch = e;
            else touch = e.changedTouches[0];
            if (grabbingDetergent) {
                const detergentClone = document.getElementById("detergent-clone");
                detergentClone.remove();
                grabbingDetergent = false;
                for (let i = 0; i < compartments.length; i++) {
                    const rect = compartments[i].getBoundingClientRect();
                    if (rect.left < touch.clientX && rect.top < touch.clientY &&
                        rect.right > touch.clientX && rect.bottom > touch.clientY
                        && compartments[i].classList.contains("open") && detergentCount > 0
                    ) {
                        compartments[i].classList.add("deterged");
                        const machine = compartments[i].parentElement;
                        const machineIndex = [].slice.call(machineEls).indexOf(machine);
                        machines[machineIndex].deterged = true;
                        detergentCount -= 1;
                        detergentCountEl.innerText = detergentCount;
                        save();
                    }
                }
            } else if (grabbingMoney) {
                const moneyClone = document.getElementById("money-clone");
                moneyClone.remove();
                grabbingMoney = false;
                for (let i = 0; i < circles.length; i++) {
                    const rect = circles[i].getBoundingClientRect();
                    if (rect.left < touch.clientX && rect.top < touch.clientY &&
                        rect.right > touch.clientX && rect.bottom > touch.clientY &&
                        !circles[i].classList.contains("inserting") && !circles[i].classList.contains("washing")) {
                        const machine = circles[i].parentElement;
                        const machineIndex = [].slice.call(machineEls).indexOf(machine);
                        const type = machines[machineIndex].type;
                        const max = machineTypes[type].max;
                        circles[i].classList.add("inserting");
                        const input = document.createElement("input");
                        input.type = "number";
                        input.min = 0;
                        if (max > money) {
                            input.max = money;
                            input.placeholder = money;
                        } else {
                            input.max = max;
                            input.placeholder = max;
                        }
                        const button = document.createElement("button");
                        button.innerText = "Insert money";
                        button.addEventListener("click", (e) => { checkStartLaundry(e.target.parentElement) })
                        circles[i].appendChild(input);
                        circles[i].appendChild(button);
                    }
                }
            }
        }

        detergent.addEventListener("mousedown", (e) => { grabDetergentStart(e, "mouse") })
        detergent.addEventListener("touchstart", (e) => { grabDetergentStart(e, "touch") })

        moneyEl.addEventListener("mousedown", (e) => { grabMoneyStart(e, "mouse") });
        moneyEl.addEventListener("touchstart", (e) => { grabMoneyStart(e, "touch") });

        document.addEventListener("mousemove", (e) => { move(e, "mouse") })
        document.addEventListener("touchmove", (e) => { move(e, "touch") })

        document.addEventListener("mouseup", (e) => { drop(e, "mouse") })
        document.addEventListener("touchend", (e) => { drop(e, "touch") })

        setInterval(updateRotations, 50);

        for (let i = 0; i < compartments.length; i++) {
            compartments[i].addEventListener("click", (e) => {
                const circle = e.target.parentElement.children[1];
                if (e.target.classList.contains("open")) {
                    e.target.classList.remove("open");
                } else if (!circle.classList.contains("washing")) {
                    e.target.classList.add("open");
                }
            })
        }

        for (let i = 0; i < sells.length; i++) {
            sells[i].addEventListener("click", (e) => {
                const machine = e.target.parentElement;
                if (!machine.children[1].classList.contains("washing")) {
                    const machineIndex = [].slice.call(machineEls).indexOf(machine);
                    machine.remove();
                    const cost = machineTypes[machines[machineIndex].type].cost;
                    changeMoney(Math.floor(cost * 3 / 4));
                    machines.splice(machineIndex, 1);
                    save();
                }
            })
        }

        for (let i = 0; i < buys.length; i++) {
            buys[i].addEventListener("click", (e) => {
                const buytype = e.target.dataset.type;
                if (buytype == "machine" && money >= 30) {
                    const type = machineTypes[e.target.dataset.machinetype];
                    changeMoney(-type.cost);
                    machineContainer.insertAdjacentHTML("beforeend", type.code);

                    machines.push({ type: e.target.dataset.machinetype, state: "idle", timer: null, money: null });

                    const machine = machineEls[machineEls.length - 1];
                    const compartment = machine.children[0];
                    const circle = machine.children[1];
                    const sell = machine.children[2];

                    compartment.addEventListener("click", (e) => {
                        const circle = e.target.parentElement.children[1];
                        if (e.target.classList.contains("open")) {
                            e.target.classList.remove("open");
                        } else if (!circle.classList.contains("washing")) {
                            e.target.classList.add("open");
                        }
                    })

                    compartment.addEventListener("dragover", (e) => {
                        e.preventDefault();
                        if (e.target.classList.contains("open")) {
                            e.target.classList.add("drag-over");
                        }
                    })

                    compartment.addEventListener("dragleave", (e) => {
                        e.target.classList.remove("drag-over");
                    })

                    compartment.addEventListener("drop", (e) => {
                        e.target.classList.remove("drag-over");
                        if (e.target.classList.contains("open")) {
                            e.preventDefault();
                            const data = e.dataTransfer.getData("text");
                            if (data.endsWith("detergent.png")) {
                                e.target.classList.add("deterged");
                            }
                        }
                    })

                    circle.addEventListener("dragover", (e) => {
                        e.preventDefault();
                        e.target.classList.add("drag-over");
                    })

                    circle.addEventListener("dragleave", (e) => {
                        e.target.classList.remove("drag-over");
                    })

                    circle.addEventListener("drop", (e) => {
                        e.target.classList.remove("drag-over")
                        e.preventDefault();
                        const data = e.dataTransfer.getData("text");
                        if (data == "money" && !e.target.classList.contains("inserting")) {
                            e.target.classList.add("inserting");
                            const input = document.createElement("input");
                            input.type = "number";
                            input.placeholder = money;
                            const button = document.createElement("button");
                            button.innerText = "Insert money";
                            button.addEventListener("click", () => { checkStartLaundry(e.target) })
                            e.target.appendChild(input);
                            e.target.appendChild(button);
                        }
                    })

                    sell.addEventListener("click", (e) => {
                        if (!machine.children[1].classList.contains("washing")) {
                            const machine = e.target.parentElement;
                            const machineIndex = [].slice.call(machineEls).indexOf(machine);
                            machine.remove();
                            const cost = machineTypes[machines[machineIndex].type].cost;
                            changeMoney(Math.floor(cost * 2 / 3));
                            machines.splice(machineIndex, 1);
                            save();
                        }
                    })
                    save();
                } else if (buytype == "detergent") {
                    // const type = e.target.dataset.detergenttype;
                    detergentCount += 4;
                    detergentCountEl.innerText = detergentCount;
                    changeMoney(-5);
                    save();
                }
            })
        }

    </script>
</body>

</html>
